# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ea99bf002074f933c82c6ae0ac0a83a9"
name = "Saku Link In Bio"
application_url = "https://sfy-link-in-bio-app.saku.so"
embedded = true
handle = "saku-link-in-bio"

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/api/v1/webhook/shopify/app/scopes_update"

  [[webhooks.subscriptions]]
  uri = "/api/v1/webhook/shopify/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/api/v1/webhook/shopify/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/api/v1/webhook/shopify/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/v1/webhook/shopify/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_online_store_navigation,read_products,read_themes,unauthenticated_read_checkouts,unauthenticated_read_metaobjects,unauthenticated_read_product_listings,unauthenticated_write_checkouts,write_files,write_online_store_navigation"

[auth]
redirect_urls = [
  "https://sfy-link-in-bio-app.saku.so/auth/callback",
  "https://sfy-link-in-bio-app.saku.so/auth/shopify/callback",
  "https://sfy-link-in-bio-app.saku.so/api/auth/callback"
]

[app_proxy]
url = "https://sfy-link-in-bio-app.saku.so/a/saku"
subpath = "saku"
prefix = "a"

[pos]
embedded = false
