version: '3.8'

services:
  # Shopify Link-in-Bio App
  sfy-link-in-bio-app:
    build:
      context: ../
      dockerfile: devops/sfy-link-in-bio-app/Dockerfile
      args:
        - VITE_API_CORE_URL=${VITE_API_CORE_URL:-http://127.0.0.1:8787}
        - VITE_POSTHOG_KEY=${VITE_POSTHOG_KEY:-phc_iYM9sMuBXqRqNfOztyvR4Nyg1YOcibB6rVleQpssuhg}
        - VITE_POSTHOG_HOST=${VITE_POSTHOG_HOST:-https://us.i.posthog.com}
        - VITE_MANTLE_APP_ID=${VITE_MANTLE_APP_ID:-abeb175f-963a-455f-bcf2-c8e58f4ab9b1}
    ports:
      - '3000:3000'
    env_file:
      - sfy-link-in-bio-app/.env.local
    restart: unless-stopped
